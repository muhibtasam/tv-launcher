# Publishes the website in docs/ to GitHub Pages (github.com/muhibtasam/vyro) whenever it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml", "tools/netflix_top10.py"]
  schedule:
    - cron: "17 6 * * 3"   # Wednesdays: Netflix's Top 10 for the week ending Sunday is out on Tuesday
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Netflix Top 10 for Home (NetflixLogic; a failed read leaves it out, the app keeps its last list)
        continue-on-error: true
        run: python3 tools/netflix_top10.py docs/netflix-top10.tsv
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
